name: Reusable build
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      debug:
        type: boolean
        default: false
    secrets:
      deploy_key:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: make "$TARGET"
        env:
          TARGET: ${{ inputs.target }}
          DEBUG: ${{ inputs.debug }}
          KEY: ${{ secrets.deploy_key }}
